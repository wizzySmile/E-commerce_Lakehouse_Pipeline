version: 2

models:
  - name: dim_customers
    description: one row per customer
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_key
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null

  - name: dim_date
    description: calendar dimension
    columns:
      - name: date_key
        tests: 
          - not_null
          - unique
  
  - name: dim_payment_types
    description: one row per payment type
    columns:
      - name: payment_type_key
        tests:
          - not_null
          - unique
      - name: payment_type
        tests: 
          - not_null
          - unique

  - name: dim_products
    description: one row per product
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_key
        tests: 
          - not_null
          - unique

  - name: dim_sellers
    description: one row per seller
    columns:
      - name: seller_id
        tests: 
          - not_null
          - unique
      - name: seller_key
        tests: 
          - not_null
          - unique

  - name: fact_sales
    description: one row per order item
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: seller_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: shipping_limit_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_orders
    description: one row per order
    columns:
      - name: order_id
        tests: 
          - not_null
          - unique
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - shipped
                  - approved
                  - processing
                  - invoiced
                  - canceled
                  - delivered
                  - created
                  - unavailable
      - name: total_order_value
        tests:
          - not_null
  
  - name: fact_payments
    description: one row per payment
    columns: 
      - name: order_id
        tests:
          - not_null
      - name: payment_type_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_types')
                field: payment_type_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
  
  - name: fact_reviews
    description: one row per order review
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: review_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: review_answer_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: review_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
              

      

