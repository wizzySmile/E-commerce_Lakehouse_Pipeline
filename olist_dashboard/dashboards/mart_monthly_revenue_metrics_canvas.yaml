type: canvas
display_name: "Monthly Revenue Overview"

defaults:
  time_range: P12M
  comparison_mode: time

rows:
  - height: 200px
    items:
      - width: 12
        kpi_grid:
          metrics_view: mart_monthly_revenue_metrics
          measures:
            - total_revenue_sum_measure
            - total_orders_sum_measure
            - total_customers_sum_measure
            - avg_order_value_avg_measure
            - late_delivery_count_sum_measure
          comparison:
            - percent_change
            - previous
          sparkline: right

  - height: 380px
    items:
      - width: 6
        line_chart:
          metrics_view: mart_monthly_revenue_metrics
          title: "Total Revenue"
          x:
            field: month_start_date
            type: temporal
          y:
            field: total_revenue_sum_measure
            type: quantitative
            zeroBasedOrigin: true
      - width: 6
        line_chart:
          metrics_view: mart_monthly_revenue_metrics
          title: "Total Orders"
          x:
            field: month_start_date
            type: temporal
          y:
            field: total_orders_sum_measure
            type: quantitative
            zeroBasedOrigin: true

  - height: 380px
    items:
      - width: 12
        line_chart:
          metrics_view: mart_monthly_revenue_metrics
          title: "Average Order Value"
          x:
            field: month_start_date
            type: temporal
          y:
            field: avg_order_value_avg_measure
            type: quantitative
            zeroBasedOrigin: false

  - height: 420px
    items:
      - width: 12
        table:
          metrics_view: mart_monthly_revenue_metrics
          title: "Monthly Summary"
          sort_by: month_start_date
          sort_dir: asc
          columns:
            - month_start_date
            - month_name
            - total_revenue_sum_measure
            - total_orders_sum_measure
            - total_customers_sum_measure
            - avg_order_value_avg_measure
            - avg_delivery_days_avg_measure
            - late_delivery_count_sum_measure
