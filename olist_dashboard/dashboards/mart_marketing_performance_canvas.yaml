type: canvas
display_name: "Marketing Performance"

defaults:
  time_range: P12M
  comparison_mode: time

rows:
  - height: 90px
    items:
      - width: 12
        markdown:
          content: |
            # Marketing Performance

            Key marketing and customer performance metrics over the last 12 months.

  - height: 200px
    items:
      - width: 12
        kpi_grid:
          metrics_view: mart_marketing_performance
          measures:
            - total_revenue
            - total_orders
            - total_customers
            - avg_order_value
            - avg_delivery_days
            - late_delivery_count
          comparison:
            - delta
            - percent_change
            - previous
          sparkline: right

  - height: 380px
    items:
      - width: 6
        line_chart:
          metrics_view: mart_marketing_performance
          title: "Total Revenue (Monthly)"
          x:
            field: month_start_date
            type: temporal
          y:
            field: total_revenue
            type: quantitative
            zeroBasedOrigin: true
      - width: 6
        bar_chart:
          metrics_view: mart_marketing_performance
          title: "Total Orders by Month"
          x:
            field: month_start_date
            type: temporal
          y:
            field: total_orders
            type: quantitative
            zeroBasedOrigin: true

  - height: 420px
    items:
      - width: 6
        leaderboard:
          metrics_view: mart_marketing_performance
          title: "Performance by State"
          dimensions:
            - customer_state
          measures:
            - total_revenue
            - total_orders
            - total_customers
            - avg_order_value
          num_rows: 15
      - width: 6
        table:
          metrics_view: mart_marketing_performance
          title: "Recent Months"
          sort_by: month_start_date
          sort_dir: desc
          columns:
            - month_start_date
            - month_name
            - total_revenue
            - total_orders
            - total_customers
            - avg_order_value
            - avg_delivery_days
            - late_delivery_count
